<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailwind 로 만든 카드</title>
<!-- 연습용 Tailwind (Play CDN) — 실제 서비스에는 Next.js 안에 설치해서 써요 -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<body class="bg-gray-100 font-sans p-10">

    <button class="mt-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2.5 rounded-full">문의 확인하기</button>
