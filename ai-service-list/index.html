<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 서비스 정리</title>
  <meta name="description" content="글쓰기, 코딩, 이미지, 영상, 음악까지 분야별로 모아 본 AI 서비스 목록. 요금과 장점, 추천 용도를 한눈에 확인하세요.">
  <meta name="theme-color" content="#f6f4ef">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow">AI SERVICE GUIDE</p>
    <h1>AI 서비스 <span class="mark">정리</span></h1>
    <p class="lead">글쓰기부터 코딩, 이미지, 영상, 음악까지.<br>분야별로 골라 보고, 요금과 장점을 한눈에 비교하세요.</p>
    <p class="stats" id="stats"></p>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="서비스, 용도, 키워드 검색" autocomplete="off" aria-label="서비스 검색">
      </label>
      <div class="chips" id="categories" role="group" aria-label="분야 필터"></div>
      <div class="subbar">
        <div class="seg" id="prices" role="group" aria-label="요금 필터"></div>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty-title">조건에 맞는 서비스가 없어요</p>
      <p>검색어를 바꾸거나 필터를 초기화해 보세요.</p>
      <button type="button" class="btn" id="reset">필터 초기화</button>
    </div>
  </main>

  <footer class="footer">
    <p>요금과 한도는 2026년 10월 기준이며 서비스 사정에 따라 바뀔 수 있어요. 가입 전 공식 사이트에서 다시 확인하세요.</p>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
      <button type="button" class="close" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="m-head">
        <span class="logo logo-lg" id="m-logo"></span>
        <div>
          <h2 id="m-name"></h2>
          <div class="m-meta" id="m-meta"></div>
        </div>
      </div>
      <p class="m-desc" id="m-desc"></p>
      <section class="m-sec">
        <h3>요금</h3>
        <ul class="list" id="m-price"></ul>
      </section>
      <section class="m-sec">
        <h3>장점</h3>
        <ul class="list" id="m-pros"></ul>
      </section>
      <section class="m-sec">
        <h3>추천 용도</h3>
        <p id="m-use"></p>
      </section>
      <a class="btn btn-dark" id="m-link" target="_blank" rel="noopener noreferrer">공식 사이트 열기 ↗</a>
    </div>
  </div>

  <script src="js/services.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
